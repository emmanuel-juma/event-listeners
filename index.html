<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Event Listeners</title>
</head>

<body>

    <h1>JavaScript Event Listeners</h1>

    <!-- Click Event -->
    <section>
        <h2>1. Click Event</h2>

        <p id="message">Click the button.</p>

        <button id="clickButton">
            Click Me
        </button>
    </section>


    <!-- Mouse Event -->
    <section>
        <h2>2. Mouse Event</h2>

        <div id="box">
            Move your mouse over me
        </div>
    </section>


    <!-- Keyboard Event -->
    <section>
        <h2>3. Keyboard Event</h2>

        <input
            type="text"
            id="keyboardInput"
            placeholder="Press a key"
        >

        <p id="keyDisplay">
            Key pressed: None
        </p>
    </section>


    <!-- Input Event -->
    <section>
        <h2>4. Input Event</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Type your name"
        >

        <p id="nameDisplay">
            Hello...
        </p>
    </section>


    <!-- Form Submit -->
    <section>
        <h2>5. Form Submit Event</h2>

        <form id="myForm">

            <input
                type="text"
                id="username"
                placeholder="Enter username"
            >

            <button type="submit">
                Submit
            </button>

        </form>

        <p id="formMessage"></p>
    </section>


    <!-- Counter -->
    <section>
        <h2>6. Practical Example: Counter</h2>

        <h3 id="count">0</h3>

        <button id="decreaseButton">-</button>

        <button id="increaseButton">+</button>
    </section>


    <script src="script.js"></script>

</body>
</html>
